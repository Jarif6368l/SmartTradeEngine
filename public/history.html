<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal History • AI Trading Analyst</title>
  <link rel="stylesheet" href="site-navigation.css">
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <header class="history-topbar">
    <div id="historyConnection" class="status-badge">Loading…</div>
  </header>
  <main class="history-container">
    <section class="summary-grid">
      <article class="summary-card"><span>TOTAL SIGNALS</span><strong id="totalSignals">0</strong></article>
      <article class="summary-card"><span>ACTIVE</span><strong id="activeSignals">0</strong></article>
      <article class="summary-card"><span>AVERAGE SETUP QUALITY</span><strong id="averageQuality">--</strong></article>
      <article class="summary-card"><span>LAST SIGNAL</span><strong id="latestSignal">--</strong></article>
    </section>

    <section class="stats-panel">
      <div class="panel-heading">
        <div><div class="section-label">LIFETIME STATISTICS</div><h2>SIGNAL PERFORMANCE</h2></div>
      </div>
      <div class="lifetime-stats-grid">
        <article class="summary-card"><span>LIFETIME SIGNALS</span><strong id="statsTotal">0</strong></article>
        <article class="summary-card"><span>ACTIVE</span><strong id="statsActive">0</strong></article>
        <article class="summary-card"><span>T1 TOUCHED</span><strong id="statsT1">0</strong></article>
        <article class="summary-card"><span>T2 HIT</span><strong id="statsT2">0</strong></article>
        <article class="summary-card"><span>SL HIT</span><strong id="statsSL">0</strong></article>
      </div>
    </section>

    <section class="history-panel">
      <div class="panel-heading">
        <div><div class="section-label">FILTERS</div><h2>TRADE SIGNAL RECORDS</h2></div>
      </div>
    </section>

    <section id="historyList" class="history-list">
      <div class="empty-state">History load ho rahi hai…</div>
    </section>
  </main>
  <script src="history.js"></script>
  <script src="site-navigation.js"></script>
</body>
</html>
