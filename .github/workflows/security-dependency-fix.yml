name: Repair vulnerable npm lockfile

on:
  push:
    branches: [fix/security-engine-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-engine-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply non-breaking lockfile security updates
        run: npm audit fix --package-lock-only
      - name: Clean install
        run: npm ci
      - name: Run full regression suite
        run: npm test
      - name: Require zero known vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Commit patched lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: patch vulnerable transitive npm dependencies"
            git push origin HEAD:fix/security-engine-audit
          else
            echo "Lockfile already contains patched dependency versions."
          fi
