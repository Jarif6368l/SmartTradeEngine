name: Build SmartTradeEngine APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-smarttradeengine-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build debug APK
        run: /tmp/gradle-8.9/bin/gradle -p android-wrapper assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartTradeEngine-debug-apk
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
